<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <canvas id="canvas1"></canvas>

    <div class="assets">
        <img id="bg" src="Assets/Img/background_single.png">
        <img id="player" src="Assets/Img/player_fish.png">
        <img id="gears" src="Assets/Img/smallGears.png">
        <audio id="charge" src="Assets/Sound/charge.mp3"></audio>
        <audio id="flap1" src="Assets/Sound/flap1.mp3"></audio>
        <audio id="flap2" src="Assets/Sound/flap2.mp3"></audio>
        <audio id="flap3" src="Assets/Sound/flap3.mp3"></audio>
        <audio id="flap4" src="Assets/Sound/flap4.mp3"></audio>
        <audio id="flap5" src="Assets/Sound/flap5.mp3"></audio>
        <audio id="win" src="Assets/Sound/win.mp3"></audio>
        <audio id="lose" src="Assets/Sound/lose.mp3"></audio>
    </div>

    <div id="container">
        <div id="controls">
            <i id="restartBtn" class="fa-solid fa-rotate-right"></i>
            <i id="pausePlayBtn" class="fa-solid fa-pause"></i>
        </div>
    </div>

    <script src="audio.js"></script>
    <script src="background.js"></script>
    <script src="player.js"></script>
    <script src="obstacle.js"></script>
    <script src="main.js"></script>
</body>

</html>
